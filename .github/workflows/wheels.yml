name: Build and publish wheels

# Builds prebuilt wheels for Windows / macOS / Linux (manylinux) with
# cibuildwheel, so `pip install bayesian-cpp` never needs a C++ compiler.
#
# Trigger: push a tag (v*) or run manually from the Actions tab.
# Publishing requires a PyPI API token stored as a GitHub secret named
# PYPI_API_TOKEN (Settings -> Secrets and variables -> Actions).

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build_wheels:
    name: wheels (${{ matrix.os }}, ${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: x86_64
            arch_linux: x86_64
          - os: windows-latest
            label: win_amd64
          - os: macos-14
            label: macos-arm64
            arch_macos: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.22.0
        env:
          # CPython versions to target (the stable ABI would need fewer).
          CIBW_BUILD: cp39-* cp310-* cp311-* cp312-* cp313-*
          CIBW_ARCHS_LINUX: ${{ matrix.arch_linux }}
          CIBW_ARCHS_MACOS: ${{ matrix.arch_macos }}
          # manylinux_2_28 ships gcc 12 -> full C++20 support.
          CIBW_MANYLINUX_X86_64_IMAGE: quay.io/pypa/manylinux_2_28_x86_64
          # Smoke-test each wheel by importing and running one inference.
          CIBW_TEST_COMMAND: python -c "import bayesian; from bayesian import Inference, Potential, Variable; x=Variable(0,'X',2); y=Variable(1,'Y',2); f=[Potential([x],[0.5,0.5]),Potential([x,y],[0.9,0.1,0.2,0.8])]; assert abs(Inference(f).marginal([y]).value({y:0})-0.55)<1e-6; print('wheel OK', bayesian.__version__)"

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ matrix.label }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: sdist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build && python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    # Only publish for a version tag push or a manual dispatch.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
